<title>Transaction Shield — Evidence for every transaction</title>
<style>
/* ============ tokens (matched to transaction-shield-demo.quadry28.chatgpt.site) ============ */
:root{
  --ink:#16231D; --ink-soft:#48564E; --ink-faint:#69766F;
  --paper:#F7F8F5; --surface:#FFFFFF; --surface-2:#F1F2F1; --surface-3:#E5E9E6;
  --border:#E5E9E6; --border-strong:#D7DFDA;
  --brand:#0E5B3C; --brand-dark:#163A2B; --brand-tint:#E9F5EE; --brand-tint-strong:#DCE7E3;
  --gold:#A65B13; --gold-tint:#FFF1DC;
  --risk-low:#216446; --risk-low-tint:#E9F5EE;
  --risk-medium:#A65B13; --risk-medium-tint:#FFF1DC;
  --risk-high:#AF4836; --risk-high-tint:#FBE9E5;
  --shadow-sm:0 1px 2px rgba(20,39,30,0.08);
  --shadow-md:0 12px 35px rgba(20,39,30,0.09);
  --shadow-lg:0 22px 55px rgba(20,42,37,0.2);
  --focus:#0E5B3C;
  --sidebar-bg:#10291E; --sidebar-ink:#DCE7E3; --sidebar-ink-soft:#748078; --sidebar-active:#173B2C;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EAF2EC; --ink-soft:#A9BDB0; --ink-faint:#748177;
    --paper:#0B1310; --surface:#111D17; --surface-2:#17251E; --surface-3:#1F3026;
    --border:#28352C; --border-strong:#374536;
    --brand:#2FB888; --brand-dark:#28704D; --brand-tint:#163A2B; --brand-tint-strong:#173B2C;
    --gold:#D7A45F; --gold-tint:#2C2413;
    --risk-low:#2FB888; --risk-low-tint:#163A2B;
    --risk-medium:#D7A45F; --risk-medium-tint:#2C2413;
    --risk-high:#E08A72; --risk-high-tint:#301613;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
    --shadow-md:0 4px 20px rgba(0,0,0,0.35);
    --shadow-lg:0 20px 60px rgba(0,0,0,0.5);
    --sidebar-bg:#0A130E; --sidebar-ink:#CBD9CE; --sidebar-ink-soft:#617164; --sidebar-active:#16281D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#EAF2EC; --ink-soft:#A9BDB0; --ink-faint:#748177;
  --paper:#0B1310; --surface:#111D17; --surface-2:#17251E; --surface-3:#1F3026;
  --border:#28352C; --border-strong:#374536;
  --brand:#2FB888; --brand-dark:#28704D; --brand-tint:#163A2B; --brand-tint-strong:#173B2C;
  --gold:#D7A45F; --gold-tint:#2C2413;
  --risk-low:#2FB888; --risk-low-tint:#163A2B;
  --risk-medium:#D7A45F; --risk-medium-tint:#2C2413;
  --risk-high:#E08A72; --risk-high-tint:#301613;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
  --shadow-md:0 4px 20px rgba(0,0,0,0.35);
  --shadow-lg:0 20px 60px rgba(0,0,0,0.5);
  --sidebar-bg:#0A130E; --sidebar-ink:#CBD9CE; --sidebar-ink-soft:#617164; --sidebar-active:#16281D;
  color-scheme: dark;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
svg{width:1em; height:1em; flex:none; vertical-align:-0.125em;}
body{
  background:var(--paper); color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:Georgia,'Times New Roman',serif; font-weight:600; margin:0; text-wrap:balance; color:var(--ink);}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:14px; color:var(--ink);}
::selection{background:var(--brand-tint-strong);}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-variant-numeric:tabular-nums;}
.tnum{font-variant-numeric:tabular-nums;}
.eyebrow{font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint);}
.hidden{display:none!important;}
.scroll-x{overflow-x:auto;}
button.reset-btn{all:unset;cursor:pointer;}

/* ============ app shell ============ */
#root{min-height:100vh;}
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:236px; flex:none; background:var(--sidebar-bg); color:var(--sidebar-ink);
  display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; z-index:40;
  transition:left .2s ease;
}
.sidebar-brand{display:flex; align-items:center; gap:10px; padding:22px 20px 18px;}
.sidebar-brand .mark{width:30px;height:30px;flex:none;}
.sidebar-brand .name{font-family:Georgia,serif; font-weight:600; font-size:17px; color:#fff; line-height:1.15;}
.sidebar-brand .name small{display:block; font-family:ui-sans-serif,sans-serif; font-weight:500; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--sidebar-ink-soft); margin-top:2px;}
.sidebar-merchant{margin:0 14px 10px; padding:12px 12px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07); border-radius:10px; display:flex; align-items:center; gap:10px;}
.sidebar-merchant .avatar{width:32px;height:32px;border-radius:8px;background:linear-gradient(155deg,var(--gold),#8a5f14); color:#1a1206; display:flex;align-items:center;justify-content:center; font-family:Georgia,serif; font-weight:700; font-size:14px; flex:none;}
.sidebar-merchant .who{min-width:0;}
.sidebar-merchant .who b{display:block; font-size:12.5px; color:#fff; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.sidebar-merchant .who span{display:block; font-size:11px; color:var(--sidebar-ink-soft);}
.sidebar-nav{flex:1; padding:6px 12px; overflow-y:auto;}
.sidebar-nav a{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:9px; color:var(--sidebar-ink); text-decoration:none; font-size:13.5px; font-weight:500; margin-bottom:2px;}
.sidebar-nav a svg{width:17px;height:17px;flex:none; opacity:.85;}
.sidebar-nav a:hover{background:rgba(255,255,255,0.05);}
.sidebar-nav a.active{background:var(--sidebar-active); color:#fff;}
.sidebar-nav a.active svg{opacity:1; color:var(--brand);}
.sidebar-nav .navlabel{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--sidebar-ink-soft); padding:14px 12px 6px;}
.sidebar-foot{padding:12px 20px 18px; border-top:1px solid rgba(255,255,255,0.07);}
.sidebar-foot button{background:none;border:1px solid rgba(255,255,255,0.14); color:var(--sidebar-ink-soft); font-size:11.5px; padding:7px 10px; border-radius:7px; width:100%;}
.sidebar-foot button:hover{color:#fff; border-color:rgba(255,255,255,0.3);}

.main{flex:1; margin-left:236px; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:16px 32px; border-bottom:1px solid var(--border); background:var(--paper);
  position:sticky; top:0; z-index:20;
}
.topbar h1{font-size:22px;}
.topbar .sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.hamburger{display:none; background:none;border:1px solid var(--border); border-radius:8px; padding:8px; margin-right:6px;}
.hamburger svg{width:18px;height:18px;display:block;}
.content{padding:28px 32px 60px; max-width:1180px; width:100%; margin:0 auto;}
.overlay-scrim{position:fixed; inset:0; background:rgba(8,12,10,0.5); z-index:39; display:none;}
.overlay-scrim.show{display:block;}

/* ============ buttons ============ */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:9px; font-size:13.5px; font-weight:600; padding:10px 16px; border:1px solid transparent; transition:background .12s,border-color .12s; white-space:nowrap; text-decoration:none;}
.btn svg{width:15px;height:15px;flex:none;}
.btn-primary{background:var(--brand); color:#fff;}
.btn-primary:hover{background:var(--brand-dark);}
.btn-secondary{background:var(--surface); color:var(--ink); border-color:var(--border-strong);}
.btn-secondary:hover{background:var(--surface-2);}
.btn-ghost{background:transparent; color:var(--ink-soft); border-color:transparent;}
.btn-ghost:hover{background:var(--surface-2); color:var(--ink);}
.btn-danger-ghost{background:transparent;color:var(--risk-high);border-color:var(--risk-high-tint);}
.btn-block{width:100%;}
.btn-lg{padding:13px 20px; font-size:14.5px;}
.btn:disabled{opacity:.5; cursor:not-allowed;}

/* ============ cards / surfaces ============ */
.card{background:var(--surface); border:1px solid var(--border); border-radius:14px;}
.card-pad{padding:20px;}
.section{margin-bottom:32px;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px;}
.section-head h2{font-size:19px;}
.section-head .link{font-size:12.5px; font-weight:600; color:var(--brand); text-decoration:none;}

/* ============ KPI tiles ============ */
.kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
.kpi{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 18px 16px; position:relative; overflow:hidden;}
.kpi .kpi-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.kpi .kpi-icon{width:30px;height:30px;border-radius:8px; display:flex;align-items:center;justify-content:center;}
.kpi .kpi-icon svg{width:16px;height:16px;}
.kpi .kpi-val{font-family:Georgia,serif; font-size:26px; font-weight:600; line-height:1.1; margin-bottom:4px;}
.kpi .kpi-label{font-size:12px; color:var(--ink-soft); font-weight:500;}
.kpi .kpi-delta{position:absolute; top:18px; right:18px; font-size:11px; font-weight:600; padding:3px 7px; border-radius:20px;}
.kpi.c-intl .kpi-icon{background:var(--brand-tint); color:var(--brand-dark);}
.kpi.c-secured .kpi-icon{background:var(--brand-tint); color:var(--brand-dark);}
.kpi.c-risk .kpi-icon{background:var(--risk-high-tint); color:var(--risk-high);}
.kpi.c-disputes .kpi-icon{background:var(--gold-tint); color:var(--gold);}

/* ============ pills / badges ============ */
.pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:20px; line-height:1.3; white-space:nowrap;}
.pill svg{width:11px;height:11px;}
.pill-low{background:var(--risk-low-tint); color:var(--risk-low);}
.pill-medium{background:var(--risk-medium-tint); color:var(--risk-medium);}
.pill-high{background:var(--risk-high-tint); color:var(--risk-high);}
.pill-neutral{background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--border);}
.pill-brand{background:var(--brand-tint); color:var(--brand-dark);}
.pill-gold{background:var(--gold-tint); color:var(--gold);}
.pill-dispute{background:var(--risk-high-tint); color:var(--risk-high);}

/* ============ table ============ */
table.txn-table{width:100%; border-collapse:collapse; font-size:13.5px;}
table.txn-table th{text-align:left; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-faint); font-weight:600; padding:0 14px 10px; border-bottom:1px solid var(--border);}
table.txn-table td{padding:13px 14px; border-bottom:1px solid var(--border); vertical-align:middle;}
table.txn-table tbody tr{cursor:pointer;}
table.txn-table tbody tr:hover{background:var(--surface-2);}
table.txn-table tbody tr:last-child td{border-bottom:none;}
.cell-cust b{display:block; font-size:13.5px; font-weight:600;}
.cell-cust span{display:block; font-size:11.5px; color:var(--ink-faint);}
.flag{font-size:14px;}
.amt-ngn{color:var(--ink-faint); font-size:11.5px;}

/* ============ forms ============ */
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px 18px;}
.field{display:flex; flex-direction:column; gap:6px;}
.field.full{grid-column:1 / -1;}
.field label{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
.field .hint{font-size:11.5px; color:var(--ink-faint); margin-top:-2px;}
.field input[type=text],.field input[type=tel],.field input[type=email],.field input[type=number],.field select,.field textarea{
  border:1px solid var(--border-strong); background:var(--surface); border-radius:9px; padding:10px 12px; color:var(--ink); width:100%;
}
.field textarea{resize:vertical; min-height:64px;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);}
.input-group{display:flex; gap:8px;}
.input-group select{flex:0 0 92px;}
.radio-row,.check-row{display:flex; align-items:center; gap:8px; font-size:13.5px;}
.toggle-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px;}
.toggle-row .t-label{font-size:13.5px; font-weight:600;}
.toggle-row .t-sub{font-size:11.5px; color:var(--ink-faint); margin-top:2px;}
.switch{position:relative; width:40px; height:23px; flex:none;}
.switch input{opacity:0; width:100%; height:100%; margin:0; position:absolute; cursor:pointer; z-index:1;}
.switch .track{position:absolute; inset:0; background:var(--border-strong); border-radius:20px; transition:.15s;}
.switch .thumb{position:absolute; top:2.5px; left:2.5px; width:18px; height:18px; background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch input:checked + .track{background:var(--brand);}
.switch input:checked + .track + .thumb{transform:translateX(17px);}
.segmented{display:flex; border:1px solid var(--border-strong); border-radius:9px; overflow:hidden;}
.segmented button{flex:1; background:var(--surface); border:none; padding:9px; font-size:13px; font-weight:600; color:var(--ink-soft); border-right:1px solid var(--border-strong);}
.segmented button:last-child{border-right:none;}
.segmented button.active{background:var(--brand-tint); color:var(--brand-dark);}
.upload-box{border:1.5px dashed var(--border-strong); border-radius:10px; padding:18px; text-align:center; background:var(--surface-2); cursor:pointer;}
.upload-box svg{width:22px;height:22px; color:var(--ink-faint); margin-bottom:6px;}
.upload-box .u-title{font-size:13px; font-weight:600;}
.upload-box .u-sub{font-size:11.5px; color:var(--ink-faint); margin-top:2px;}
.upload-box.filled{background:var(--brand-tint); border-style:solid; border-color:var(--brand-tint-strong);}
.upload-box.filled .u-title{color:var(--brand-dark);}
.checkbox-line{display:flex; gap:10px; align-items:flex-start; font-size:13.5px; line-height:1.5;}
.checkbox-line input{margin-top:3px; width:16px;height:16px; accent-color:var(--brand); flex:none;}

/* ============ risk breakdown ============ */
.risk-banner{display:flex; align-items:center; gap:16px; padding:20px 22px; border-radius:14px; border:1px solid; margin-bottom:20px;}
.risk-banner .r-icon{width:46px;height:46px;border-radius:12px; display:flex;align-items:center;justify-content:center; flex:none;}
.risk-banner .r-icon svg{width:24px;height:24px;}
.risk-banner .r-tier{font-family:Georgia,serif; font-size:22px; font-weight:600;}
.risk-banner .r-desc{font-size:13px; margin-top:2px;}
.risk-banner.rb-low{background:var(--risk-low-tint); border-color:var(--risk-low-tint);} .risk-banner.rb-low .r-icon{background:rgba(255,255,255,.35); color:var(--risk-low);}
.risk-banner.rb-medium{background:var(--risk-medium-tint); border-color:var(--risk-medium-tint);} .risk-banner.rb-medium .r-icon{background:rgba(255,255,255,.35); color:var(--risk-medium);}
.risk-banner.rb-high{background:var(--risk-high-tint); border-color:var(--risk-high-tint);} .risk-banner.rb-high .r-icon{background:rgba(255,255,255,.35); color:var(--risk-high);}

.factor-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px;}
.factor-list li{display:flex; align-items:flex-start; gap:10px; font-size:13.5px;}
.factor-list li svg{width:15px;height:15px; flex:none; margin-top:2px; color:var(--ink-faint);}

.evidence-list{display:flex; flex-direction:column; gap:10px;}
.ev-item{display:flex; align-items:center; gap:13px; padding:14px 16px; border:1px solid var(--border); border-radius:11px; background:var(--surface);}
.ev-item .ev-icon{width:34px;height:34px; border-radius:9px; display:flex;align-items:center;justify-content:center; flex:none;}
.ev-item .ev-icon svg{width:17px;height:17px;}
.ev-item .ev-body{flex:1; min-width:0;}
.ev-item .ev-title{font-size:13.5px; font-weight:600;}
.ev-item .ev-sub{font-size:11.5px; color:var(--ink-faint); margin-top:1px;}
.ev-item.st-verified .ev-icon{background:var(--brand-tint); color:var(--brand-dark);}
.ev-item.st-pending .ev-icon{background:var(--risk-medium-tint); color:var(--risk-medium);}
.ev-item.st-missing .ev-icon{background:var(--risk-high-tint); color:var(--risk-high);}
.ev-item.st-optional .ev-icon{background:var(--surface-2); color:var(--ink-faint);}

.progress-ring{position:relative; width:56px; height:56px; flex:none;}
.progress-ring svg{transform:rotate(-90deg);}
.progress-ring .pr-val{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; font-family:ui-monospace,monospace;}

/* ============ vault list ============ */
.vault-row{display:flex; align-items:center; gap:16px; padding:16px 18px; border:1px solid var(--border); border-radius:13px; background:var(--surface); cursor:pointer;}
.vault-row:hover{border-color:var(--border-strong);}
.vault-row .v-mid{flex:1; min-width:0;}
.vault-row .v-mid b{font-size:14px; display:block;}
.vault-row .v-mid .v-meta{font-size:12px; color:var(--ink-faint); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap;}
.vault-row .v-amt{font-size:14px; font-weight:600; text-align:right;}
.filter-tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
.filter-tabs button{background:var(--surface); border:1px solid var(--border); padding:7px 13px; border-radius:20px; font-size:12.5px; font-weight:600; color:var(--ink-soft);}
.filter-tabs button.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}

/* ============ dispute cards ============ */
.dispute-card{border:1px solid var(--border); border-radius:14px; background:var(--surface); padding:20px; display:flex; flex-direction:column; gap:14px; cursor:pointer;}
.dispute-card:hover{border-color:var(--border-strong);}
.dispute-card .d-top{display:flex; justify-content:space-between; gap:12px; align-items:flex-start;}
.strength-bar{height:7px; border-radius:6px; background:var(--surface-3); overflow:hidden;}
.strength-bar > div{height:100%; border-radius:6px;}
.trust-stat{display:flex; gap:10px; align-items:center; padding:14px 16px; background:var(--brand-tint); border:1px solid var(--brand-tint-strong); border-radius:12px; font-size:12.5px; color:var(--brand-dark);}
.trust-stat svg{width:18px;height:18px;flex:none;}

/* ============ tabs (detail page) ============ */
.tabbar{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:22px;}
.tabbar button{background:none; border:none; padding:11px 4px; margin-right:22px; font-size:13.5px; font-weight:600; color:var(--ink-faint); border-bottom:2px solid transparent; position:relative; top:1px;}
.tabbar button.active{color:var(--ink); border-color:var(--brand);}

/* ============ timeline ============ */
.timeline{list-style:none; margin:0; padding:0; position:relative;}
.timeline li{display:flex; gap:14px; padding-bottom:20px; position:relative;}
.timeline li:last-child{padding-bottom:0;}
.timeline li:not(:last-child)::before{content:"";position:absolute; left:5px; top:16px; bottom:0; width:1px; background:var(--border-strong);}
.timeline .t-dot{width:11px;height:11px; border-radius:50%; background:var(--brand); margin-top:4px; flex:none; border:2px solid var(--brand-tint);}
.timeline .t-body b{font-size:13.5px;}
.timeline .t-body .t-when{font-size:11.5px; color:var(--ink-faint); margin-top:1px;}

/* ============ modal / toast ============ */
.modal-scrim{position:fixed; inset:0; background:rgba(8,14,11,0.55); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; padding:20px; z-index:100;}
.modal{background:var(--surface); border-radius:16px; max-width:460px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-lg); border:1px solid var(--border);}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border);}
.modal-head h3{font-size:16px;}
.modal-close{background:none;border:none; color:var(--ink-faint); width:28px;height:28px; border-radius:8px; display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:var(--surface-2);}
.modal-body{padding:20px;}
.modal-foot{padding:16px 20px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end;}
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:10px; font-size:13px; font-weight:500; z-index:200; box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:8px;}
.toast svg{width:15px;height:15px; color:var(--brand);}

/* ============ verify (customer) shell ============ */
.verify-shell{min-height:100vh; background:var(--paper); display:flex; justify-content:center; padding:32px 16px 60px;}
.verify-wrap{width:100%; max-width:420px;}
.verify-back{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-faint); text-decoration:none; margin-bottom:14px;}
.ticket{background:var(--surface); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow-md); overflow:hidden;}
.ticket-head{background:linear-gradient(155deg,var(--brand-dark),var(--brand)); color:#fff; padding:22px 22px 20px; text-align:center;}
.ticket-head .shield{width:36px;height:36px; margin:0 auto 10px;}
.ticket-head h2{color:#fff; font-size:17px;}
.ticket-head p{margin:4px 0 0; font-size:12px; opacity:.85;}
.perf{height:14px; position:relative; background:var(--surface);}
.perf::before{content:"";position:absolute; left:0;right:0;top:-7px; height:14px; background:radial-gradient(circle,var(--paper) 6px,transparent 6.5px); background-size:20px 14px; background-position:0 0;}
.ticket-body{padding:22px;}
.steps{display:flex; align-items:center; gap:6px; margin-bottom:22px;}
.steps .st{flex:1; height:4px; border-radius:3px; background:var(--surface-3);}
.steps .st.done{background:var(--brand);}
.steps .st.now{background:var(--brand); opacity:.5;}
.verify-summary-row{display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
.verify-summary-row:last-child{border-bottom:none;}
.verify-summary-row .k{color:var(--ink-faint);}
.verify-summary-row .v{font-weight:600; text-align:right;}
.otp-row{display:flex; gap:8px; justify-content:center; margin:18px 0;}
.otp-row input{width:42px; height:50px; text-align:center; font-size:20px; font-weight:600; border:1.5px solid var(--border-strong); border-radius:10px; font-family:ui-monospace,monospace;}
.otp-row input:focus{border-color:var(--brand);}
.demo-hint{text-align:center; font-size:11.5px; color:var(--ink-faint); background:var(--surface-2); border-radius:8px; padding:8px; margin-bottom:6px;}
.big-amount{text-align:center; margin:4px 0 18px;}
.big-amount .amt{font-family:Georgia,serif; font-size:34px; font-weight:600;}
.big-amount .fx{font-size:12px; color:var(--ink-faint); margin-top:2px;}
.auth-quote{background:var(--surface-2); border-left:3px solid var(--brand); padding:13px 15px; border-radius:0 10px 10px 0; font-size:13px; line-height:1.55; margin:16px 0;}
.sep-note{display:flex; gap:9px; font-size:11.5px; color:var(--ink-faint); background:var(--surface-2); border-radius:9px; padding:10px 12px; margin-top:14px;}
.sep-note svg{width:14px;height:14px;flex:none; margin-top:1px;}
.done-check{width:60px;height:60px; border-radius:50%; background:var(--brand-tint); color:var(--brand); display:flex; align-items:center; justify-content:center; margin:6px auto 16px;}
.done-check svg{width:30px;height:30px;}

/* qr modal canvas wrap */
.qr-wrap{display:flex; flex-direction:column; align-items:center; gap:12px;}
.qr-wrap canvas{border:1px solid var(--border); border-radius:10px;}
.link-copy{display:flex; gap:8px; width:100%;}
.link-copy input{flex:1; border:1px solid var(--border-strong); border-radius:8px; padding:8px 10px; font-size:12px; background:var(--surface-2); color:var(--ink-soft);}

/* doc preview */
.doc-preview{background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:20px;}
.doc-preview .dp-head{text-align:center; border-bottom:1px dashed var(--border-strong); padding-bottom:14px; margin-bottom:14px;}
.doc-preview .dp-head .dp-eyebrow{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint);}
.doc-preview .dp-head h4{font-size:16px; margin-top:4px;}
.doc-section{margin-bottom:12px;}
.doc-section .ds-title{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin-bottom:6px;}
.doc-row{display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0;}
.doc-check{display:flex; align-items:center; gap:7px; font-size:12.5px; padding:3px 0;}
.doc-check svg{width:13px;height:13px;}

/* transaction detail header */
.txn-head{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:6px; flex-wrap:wrap;}
.txn-head .th-id{font-size:12px; color:var(--ink-faint);}
.detail-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:20px;}
.kv-list{display:flex; flex-direction:column;}
.kv-row{display:flex; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
.kv-row:last-child{border-bottom:none;}
.kv-row .k{color:var(--ink-faint);}
.kv-row .v{font-weight:600; text-align:right;}

/* empty */
.empty-note{text-align:center; padding:40px 20px; color:var(--ink-faint); font-size:13.5px;}

/* ============ evidence record sections ============ */
.rs-head{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
.rs-num{width:22px;height:22px;border-radius:50%; background:var(--brand-tint); color:var(--brand-dark); font-size:11px; font-weight:700; display:flex;align-items:center;justify-content:center; flex:none; font-family:ui-monospace,monospace;}
.rs-head h3{font-size:15px;}
.doc-chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.doc-chip{display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:6px 10px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border); color:var(--ink-soft);}
.doc-chip svg{width:13px;height:13px;}
.doc-chip.muted{color:var(--ink-faint); font-style:italic;}

/* ============ dispute reason picker ============ */
.reason-option{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border:1px solid var(--border-strong); border-radius:10px; cursor:pointer; font-size:13.5px;}
.reason-option input{margin-top:3px; accent-color:var(--brand); width:16px;height:16px; flex:none;}
.reason-option:has(input:checked){border-color:var(--brand); background:var(--brand-tint);}
.ro-sub{font-size:11.5px; color:var(--ink-faint); margin-top:2px; font-weight:400;}

/* ============ guidance callout ============ */
.callout{display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border-radius:12px; border:1px solid var(--border); background:var(--surface-2); margin-bottom:18px;}
.callout svg{width:18px;height:18px; flex:none; color:var(--brand-dark); margin-top:1px;}
.callout .c-text{flex:1; font-size:12.5px; color:var(--ink-soft);}
.callout .c-actions{flex:none;}
.priority-tag{display:inline-block; font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:3px 9px; border-radius:12px; background:var(--gold-tint); color:var(--gold);}

/* ============ flagship demo banner ============ */
.flagship-banner{display:flex; align-items:center; gap:16px; padding:18px 20px; border-radius:14px; background:linear-gradient(135deg,var(--brand-dark),var(--brand)); color:#fff; margin-bottom:24px; flex-wrap:wrap;}
.flagship-banner .fb-icon{width:42px;height:42px;border-radius:11px; background:rgba(255,255,255,.15); display:flex;align-items:center;justify-content:center; flex:none;}
.flagship-banner .fb-icon svg{width:22px;height:22px;}
.flagship-banner h3{color:#fff; font-size:16px;}
.flagship-banner p{margin:2px 0 0; font-size:12.5px; color:rgba(255,255,255,.85);}
.flagship-banner .btn{background:#fff; color:var(--brand-dark);}
.flagship-banner .btn:hover{background:rgba(255,255,255,.9);}

/* ============ hero (dashboard) ============ */
.hero-block{margin-bottom:22px;}
.hero-block h2{font-size:28px; margin-bottom:6px; text-wrap:balance;}
.hero-block .hero-sub{font-size:14px; color:var(--ink-soft); margin-bottom:8px;}
.hero-block .hero-disclaimer{font-size:11.5px; color:var(--ink-faint);}

/* ============ send verification tabs ============ */
.send-tabs{display:flex; gap:6px; border-bottom:1px solid var(--border); padding-bottom:14px; margin-bottom:12px;}
.send-tabs button{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:1px solid var(--border); border-radius:9px; padding:10px 6px; font-size:11px; font-weight:600; color:var(--ink-soft);}
.send-tabs button svg{width:16px;height:16px;}
.send-tabs button.active{border-color:var(--brand); background:var(--brand-tint); color:var(--brand-dark);}
.chat-preview{border-radius:12px; padding:16px;}
.chat-preview.wa{background:var(--brand-tint);}
.chat-preview.sms{background:var(--surface-2);}
.chat-bubble{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:12.5px; line-height:1.5;}

/* ============ dispute reason dropdown ============ */
select.reason-select{border:1px solid var(--border-strong); background:var(--surface); border-radius:9px; padding:10px 12px; color:var(--ink); width:100%;}

/* responsive */
@media (max-width: 1023px){
  .sidebar{display:none;}
  .sidebar.open{display:flex!important;}
  .main{margin-left:0;}
  .hamburger{display:inline-flex;}
  .overlay-scrim.show{display:block;}
}
@media (max-width: 860px){
  .kpi-grid{grid-template-columns:1fr 1fr;}
  .form-grid{grid-template-columns:1fr;}
  .detail-grid{grid-template-columns:1fr;}
  .content{padding:20px 16px 50px;}
  .topbar{padding:14px 16px; flex-wrap:wrap; row-gap:10px;}
  .hero-block h2{font-size:22px;}
  .vault-row{flex-wrap:wrap;}
  .vault-row .v-amt{margin-left:auto;}
}
@media (max-width: 520px){
  .kpi-grid{grid-template-columns:1fr;}
  .otp-row{gap:6px;}
  .otp-row input{width:36px; height:44px; font-size:17px;}
  .send-tabs button span{font-size:10px;}
}

/* ============================================================ RISK ENGINE (rule-based, 0-100 prototype score) ============================================================ */
function computeRisk(t){
  const ngn = toNGN(t.amount, t.currency);
  let score = 0; const factors = [];
  if (t.isIntl){ score += 28; factors.push({text:"International card", note:"Cross-border cards carry higher dispute and unfamiliarity risk."}); }
  if (ngn >= 1000000){ score += 21; factors.push({text:`High-value transaction (${fmtNGN(ngn)})`, note:"Large amounts attract more scrutiny and are more attractive dispute targets."}); }
  else if (ngn >= 250000){ score += 12; factors.push({text:`Above-average transaction value (${fmtNGN(ngn)})`, note:"Moderate value — worth documenting thoroughly."}); }
  if (t.isNewCustomer){ score += 15; factors.push({text:"First transaction with this customer", note:"No prior transaction history to reference if disputed."}); }
  if (t.type === "hospitality"){ score += 18; factors.push({text:"High-value hospitality / nightlife purchase", note:"VIP table and bottle-service transactions carry a disproportionately high friendly-fraud and chargeback rate industry-wide."}); }
  else if (t.type === "service"){ score += 8; factors.push({text:"Service-based transaction", note:"No shipping tracking number is possible — proof of service matters more."}); }
  if (!t.last4){ score += 6; factors.push({text:"No card reference captured", note:"Paid by transfer or reference only, without a card fingerprint on file."}); }
  score = Math.min(100, score);
  let tier = "Low";
  if (score >= 60) tier = "High"; else if (score >= 30) tier = "Medium";
  if (factors.length === 0) factors.push({text:"Local card, returning customer, moderate value", note:"No elevated risk factors detected by the rule set."});
  const verificationLevel = tier==='High' ? 'Additional' : tier==='Medium' ? 'Enhanced' : 'Standard';
  return { score, tier, factors, ngn, verificationLevel };
}

/* ============================================================ EVIDENCE ENGINE ============================================================ */
function evidenceSlots(t, risk){
  const slots = [
    { key:"phone", title:"Phone signal (supplementary)", weight:8, phase:"optional", icon:"phone", sub:"A one-time code sent to the number on file, used as a corroborating signal — not proof of identity or card ownership. Never required on its own, regardless of transaction value.", required:false, optional:true },
    { key:"auth", title:"Explicit customer authorization", weight:15, phase:"before", icon:"checkCircle", sub:"Customer confirms they authorized this exact transaction.", required:true },
    { key:"amountAck", title:"Amount acknowledgment", weight:14, phase:"before", icon:"file", sub:`Customer confirmed the exact amount charged (${fmtCcy(t.amount,t.currency)}).`, required:true },
    { key:"merchantAck", title:"Merchant / service acknowledgment", weight:14, phase:"before", icon:"checkCircle", sub:"Customer confirmed they recognize the merchant and the service or item described.", required:true },
  ];
  if (t.type === "goods"){
    slots.push({ key:"receipt", title:"Order details / invoice", weight:14, phase:"before", icon:"file", sub:"Itemized order confirming what was purchased.", required:true });
    slots.push({ key:"shippingTracking", title:"Carrier-reported delivery", weight:11, phase:"after", icon:"bag", sub:"Courier tracking number showing the shipment as in transit or delivered — reported by the carrier, not the customer.", required:true });
    slots.push({ key:"deliveryConfirmation", title:"Recipient acknowledgment", weight:11, phase:"after", icon:"checkCircle", sub:"The recipient's own confirmation that the parcel reached them. A separate record from carrier tracking — one does not stand in for the other.", required:true, critical:true });
  } else {
    slots.push({ key:"receipt", title:"Itemized receipt", weight:14, phase:"before", icon:"file", sub:"Line-item breakdown of what was paid for.", required:true });
    slots.push({ key:"fulfillment", title: t.type==="hospitality" ? "Reservation & check-in confirmation" : "Proof of service", weight:22, phase:"after", icon:"bag", sub: t.type==="hospitality" ? "Confirms the guest checked in and the booked VIP table / bottle package was fulfilled." : "Evidence the service was actually rendered.", required:true });
  }
  slots.push({ key:"completion", title:"Customer completion acknowledgment", weight:6, phase:"optional", icon:"checkCircle", sub:"Optional — customer confirms after the fact that everything was as expected.", required:false, optional:true });
  return slots;
}

function evidenceStatusMeta(status){
  if (status === "verified") return { label:"Verified", cls:"st-verified", icon:"check" };
  if (status === "pending") return { label:"Pending", cls:"st-pending", icon:"clock" };
  if (status === "missing") return { label:"Missing", cls:"st-missing", icon:"x" };
  if (status === "optional-pending") return { label:"Recommended", cls:"st-optional", icon:"info" };
  return { label:"Not required", cls:"st-optional", icon:"info" };
}

function evidenceCompleteness(t){
  const risk = computeRisk(t);
  const slots = evidenceSlots(t, risk);
  const required = slots.filter(s=>s.required);
  const optional = slots.filter(s=>!s.required && s.phase==='optional');
  const rawRequiredTotal = required.reduce((s,i)=>s+i.weight,0) || 1;
  const TARGET_REQUIRED = 94, TARGET_OPTIONAL = 6;
  const scale = TARGET_REQUIRED / rawRequiredTotal;
  let pct = 0;
  required.forEach(s=>{ const st=t.evidence[s.key]; if (st==='verified' || st==='not-required') pct += s.weight*scale; });
  const optionalShare = TARGET_OPTIONAL / (optional.length || 1);
  optional.forEach(s=>{ if (t.evidence[s.key]==='verified') pct += optionalShare; });
  pct = Math.round(Math.min(100,pct));
  let label = 'Needs Attention';
  if (pct>=70) label='Strong'; else if (pct>=40) label='Building';
  const criticalGap = required.find(s=>s.critical && t.evidence[s.key]!=='verified' && t.evidence[s.key]!=='not-required');
  return { pct, label, risk, slots, required, optional, criticalGap };
}

function guestMatch(t){
  const same = !t.leadGuest;
  return {
    same,
    leadGuest: same ? t.customer : t.leadGuest,
    bookedVia: t.bookedVia || null,
    label: same ? 'Same person' : `${t.leadGuest} (not the cardholder)`,
    note: same
      ? 'The cardholder was the lead guest — no separate authorization gap here.'
      : `${t.customer} is the cardholder, but ${t.leadGuest} was the lead guest who actually attended.${t.bookedVia?` ${t.bookedVia}.`:''} A “Transaction Not Recognized” claim is easier for the cardholder to make when they weren’t the one physically present — proof connecting them to authorizing this specific guest’s attendance matters more here.`
  };
}
/* a booking paid by more than one person — each payer authorizes their own slice */
function splitPaymentInfo(t){
  const splits = t.splitPayments || [];
  if (!splits.length) return null;
  const otherTotal = splits.reduce((s,p)=>s+p.amount,0);
  const leadShare = t.amount - otherTotal;
  const leadAuthorized = t.evidence.auth === 'verified';
  const verifiedCount = splits.filter(p=>p.authorized).length + (leadAuthorized?1:0);
  const total = splits.length + 1;
  return { splits, leadShare, leadAuthorized, verifiedCount, total, allVerified: verifiedCount === total };
}

            <div style="font-size:11px;font-weight:500;color:var(--ink-soft);margin-top:2px">${p.provider} · <span class="mono">${p.ref}</span></div>
            <div style="margin-top:6px">${p.authorized
              ? `<span class="pill pill-brand">${icon('check')}Authorized</span>`
              : `<span class="pill pill-high">${icon('x')}Not yet authorized</span><br><button type="button" class="btn btn-ghost" style="padding:3px 9px;font-size:11px;margin-top:6px" data-action="verify-split-payer" data-id="${t.id}" data-phone="${p.phone}">Send verification</button>`}
            </div>
          </span>
        </div>`).join('')}
    </div>
    <div class="hint" style="margin-top:10px;${sp.allVerified?'':'color:var(--risk-medium)'}">${sp.allVerified ? `All ${sp.total} payers have confirmed their own charge and authorization.` : `${sp.verifiedCount} of ${sp.total} payers confirmed so far. A dispute from an unverified payer is harder to defend until this is sent.`}</div>
  </div>`;
}
/* card chargeback vs. transfer/wallet complaint — these do not work the same way */
function disputeMechanism(t){
  const isTransfer = t.network === 'Bank Transfer';
  return {
    key: isTransfer ? 'transfer' : 'card',
    label: isTransfer ? 'Transfer / wallet complaint' : 'Card dispute (chargeback)',
    short: isTransfer ? 'No card network involved' : 'Formal card network process',
    note: isTransfer
      ? 'This was paid by bank transfer — no card network is involved. Recovery goes through your payment provider’s complaint process (or the sending bank), not a card chargeback. There is no formal reason code and no guaranteed response window.'
      : 'This was a card payment, so a dispute follows the card network’s formal chargeback process — a reason code, a fixed window to respond with evidence, and possible arbitration if unresolved.'
  };
}
/* dispute-reason evidence prioritization */
function reasonProfile(reasonText){
  const r = (reasonText||'').toLowerCase();
  if (r.includes('not recognized') || r.includes('unrecognized')) return { label:'Transaction Not Recognized', priority:['auth','amountAck','merchantAck','phone','fulfillment'], rationale:'Proof the customer explicitly authorized this exact transaction — the itemized bill they confirmed, and what they said it was for — carries the most weight against a "not recognized" claim. The phone signal is supplementary corroboration, not identity proof.' };
  if (r.includes('incorrect amount') || r.includes('wrong amount')) return { label:'Incorrect Amount', priority:['receipt','amountAck','merchantAck','auth'], rationale:'The itemized receipt and the customer’s explicit amount acknowledgment directly counter an amount dispute.' };
  if (r.includes('not received')) return { label:reasonText, priority:['fulfillment','shippingTracking','deliveryConfirmation','receipt','completion','auth'], rationale:'Proof the service or shipment was actually fulfilled — reservation, check-in, tracking and delivery confirmation — matters most against a "not received" claim.' };
  return { label: reasonText || 'General dispute', priority:['receipt','auth','phone','fulfillment'], rationale:'Standard evidence package, ordered by overall relevance to this transaction.' };
}
function sortByPriority(items, priority){
  return [...items].sort((a,b)=>{ const ra=priority.indexOf(a.key), rb=priority.indexOf(b.key); return (ra===-1?99:ra)-(rb===-1?99:rb); });
}
function renderLineItems(items){
  if (!items || !items.length) return `<div class="hint">No itemized line items on file.</div>`;
  const total = items.reduce((s,i)=>s+i.amount,0);
  return `<div class="doc-preview" style="padding:14px 16px">${items.map(i=>`<div class="doc-row"><span>${i.label}</span><span class="tnum" style="font-weight:600">${fmtNGN(i.amount)}</span></div>`).join('')}<div class="doc-row" style="border-top:1px dashed var(--border-strong);margin-top:6px;padding-top:8px"><span style="font-weight:700">Total</span><span class="tnum" style="font-weight:700">${fmtNGN(total)}</span></div></div>`;
}
function renderAuditTimeline(id){
  const acts = getActivity(id);
  return `<ul class="timeline">${acts.map(a=>`<li><div class="t-dot"></div><div class="t-body"><b>${a.label}</b><div class="t-when">${a.actor} · ${fmtDateTime(a.ts)}</div></div></li>`).join('')}</ul>`;
}

/* merchant-facing WhatsApp notification preview — same events as the audit trail, framed as what actually reaches the merchant's phone */
function waMessageFor(a, t){

function waBold(s){ return s.replace(/\*(.+?)\*/g, '<b>$1</b>'); }
function gapAlertMessage(t){
  const e = evidenceCompleteness(t);
  if (!e.criticalGap) return null;
  const noDispute = t.dispute ? '' : ' No dispute exists yet — this is worth closing now.';
  if (e.criticalGap.key==='deliveryConfirmation'){
    return `⚠️ *Evidence gap* — ${t.id}\nCarrier reported delivery for ${t.customer}'s ${t.desc}, but recipient acknowledgment is still missing.${noDispute}`;
  }

}
function renderWhatsAppMerchantPreview(id){

}

/* guided end-to-end demo: suggested next step for a transaction */
function nextStepFor(t){
  const e = t.evidence;
  const fulfillKey = t.type==='goods' ? 'deliveryConfirmation' : 'fulfillment';
  if (!t.dispute){
    if (e.auth !== 'verified') return {text:"Send the customer a verification link so they can review, verify their phone, and authorize this transaction.", cta:"Send Verification", action:"send-link"};
    if (e.receipt !== 'verified') return {text:"Attach the itemized receipt for this transaction.", cta:"Upload itemized receipt", action:"upload-receipt"};
    if (e[fulfillKey] !== 'verified' && e[fulfillKey] !== 'not-required') return {text: t.type==='hospitality' ? "Log the guest's check-in once the VIP table and bottle service has been fulfilled." : t.type==='goods' ? "Capture the recipient's own acknowledgment once the package arrives — carrier tracking alone isn't enough." : "Log proof of service once the order has been fulfilled.", cta: t.type==='goods'?"Capture Recipient Acknowledgment":"Add Proof of Service", action:"open-fulfillment"};
    return {text:"Evidence Complete — No Action Required. You can still simulate a dispute above to see how a representment package would be built from what's already on file.", cta:null};
  }
  return {text:`A dispute is on file — “${t.dispute.reason}”. The evidence already on file is ready to be organized into a package — no reconstruction needed.`, cta:"Go to Disputes", nav:"#/disputes"};
}
function renderNextStepCallout(t){
  const e = evidenceCompleteness(t);
  if (e.criticalGap){
    const noDisputeLine = t.dispute ? '' : `<div style="margin-bottom:4px">No dispute exists on this transaction — this is a gap to close now, before one is ever filed.</div>`;
    const msg = e.criticalGap.key==='deliveryConfirmation'
      ? 'The carrier reported delivery, but recipient acknowledgment is missing. Those are two different records — carrier tracking alone won\'t stand in for the recipient confirming they received it.'
      : `A future dispute may be harder to defend without ${e.criticalGap.title.toLowerCase()}.`;
    return `<div class="callout" style="background:var(--risk-high-tint);border-color:var(--risk-high-tint)">${icon('alert')}<div class="c-text"><b>Evidence Gap</b><br>${noDisputeLine}${msg}</div><div class="c-actions"><button type="button" class="btn btn-secondary" data-action="open-fulfillment" data-id="${t.id}">${icon('bag')}<span>${e.criticalGap.key==='deliveryConfirmation'?'Capture Recipient Acknowledgment':'Resolve gap'}</span></button></div></div>`;
  }
  const step = nextStepFor(t);
  const ctaHtml = !step.cta ? '' : step.nav ? `<a href="${step.nav}" class="btn btn-secondary">${step.cta}</a>` : `<button type="button" class="btn btn-secondary" data-action="${step.action}" data-id="${t.id}">${step.cta}</button>`;
  return `<div class="callout">${icon('arrowRight')}<div class="c-text"><b>Suggested next step:</b> ${step.text}</div>${ctaHtml?`<div class="c-actions">${ctaHtml}</div>`:''}</div>`;
}

/* Evidence Autopilot — what should exist for this transaction, what exists, what's due by this stage, and whether anything is materially missing */
function renderEvidenceAutopilot(t, e){
  const materiallyMissing = e.required.filter(s=> t.evidence[s.key]==='missing');
  const inProgress = e.required.filter(s=> t.evidence[s.key]==='pending');
  const isComplete = materiallyMissing.length===0 && inProgress.length===0;
  return `
  <div class="card card-pad" style="${isComplete?'background:var(--brand-tint);border-color:var(--brand-tint-strong)':''}">

    <div class="hint" style="margin-bottom:14px">Checks what evidence a transaction like this should have, what's already on file, and what's expected by this stage. A transaction is never flagged just for being high-value, and evidence that isn't due yet is never counted as missing.</div>
    <div style="display:flex;align-items:center;gap:16px">
      ${progressRing(e.pct,56)}
      <div>
        <div style="font-weight:700;font-size:16px">${isComplete ? 'Evidence Complete' : `${e.pct}% — ${evLabel(e)}`}</div>

      </div>

    ${inProgress.length ? `<div style="margin-top:${materiallyMissing.length?'12px':'14px'}"><div class="eyebrow" style="margin-bottom:6px">Not yet due</div><ul class="factor-list">${inProgress.map(s=>`<li>${icon('clock')}<span>${s.title} — expected once this stage is reached; not counted as a gap.</span></li>`).join('')}</ul></div>` : ''}
  </div>`;
}

/* where each evidence item actually comes from and how it was captured — provider-neutral framing, tagged by provenance */
function evidenceSourceRows(t, risk){
  const slots = evidenceSlots(t, risk);
  const rows = [ { key:'payment', title:"Payment record", source: t.provider || "Payment provider", acquisition:"Automatic", provenance:"Provider-sourced" } ];
  const SRC = {
    phone: { source:"Transaction Shield (link reply)", acquisition:"Customer confirmed", provenance:"Customer-confirmed" },
    auth: { source:"Transaction Shield", acquisition:"Customer confirmed", provenance:"Customer-confirmed" },
    amountAck: { source:"Transaction Shield", acquisition:"Customer confirmed", provenance:"Customer-confirmed" },
    merchantAck: { source:"Transaction Shield", acquisition:"Customer confirmed", provenance:"Customer-confirmed" },
    receipt: { source: t.receiptFileName ? `${t.provider||'Merchant'} · POS` : "Merchant system", acquisition: t.receiptFileName ? "Automatic" : "Merchant supplied", provenance: t.receiptFileName ? "Provider-sourced" : "Merchant-reported" },
    fulfillment: { source:"Merchant staff", acquisition:"Merchant supplied", provenance:"Merchant-reported" },
    shippingTracking: { source:"Courier / logistics partner", acquisition:"Automatic", provenance:"Provider-sourced" },
    deliveryConfirmation: { source:"Customer (recipient)", acquisition:"Customer confirmed", provenance:"Customer-confirmed" },
    completion: { source:"Customer", acquisition:"Customer supplied", provenance:"Customer-confirmed" },
  };
  slots.forEach(s=>{
    const st = t.evidence[s.key];
    if (st === undefined) return;
    const meta = SRC[s.key] || { source:"Merchant system", acquisition:"Automatic", provenance:"Merchant-reported" };
    const status = st==='verified' ? 'Captured' : st==='not-required' ? 'Not required' : st==='pending' ? 'In progress' : 'Not yet captured';
    rows.push({ key:s.key, title:s.title, source:meta.source, acquisition:meta.acquisition, provenance:meta.provenance, status });
  });
  return rows;
}
function provenanceTag(p){ return `<span class="pill pill-neutral" style="font-weight:600">${p}</span>`; }

/* the Transaction Evidence Record: Payment, Authentication, Commercial Record, Fulfillment, Supporting Evidence, Audit Trail */

  return `
  <div class="card card-pad">

      <div class="kv-row"><span class="k">Card</span><span class="v">${t.network}${t.last4?' •••• '+t.last4:' (no card on file)'}</span></div>
      <div class="kv-row"><span class="k">Date</span><span class="v">${fmtDateTime(t.date)}</span></div>
    </div>
  </div>

  <div class="card card-pad">
    <div class="rs-head"><span class="rs-num">2</span><h3>Authentication</h3>${provenanceTag('Customer-confirmed')}</div>
    <div class="kv-list">
      <div class="kv-row"><span class="k">Customer</span><span class="v">${t.customer}</span></div>
      <div class="kv-row"><span class="k">Phone on file</span><span class="v mono">${maskPhone(t.phone)}</span></div>
      <div class="kv-row"><span class="k">Phone signal (supplementary)</span><span class="v">${t.evidence.phone==='verified' ? 'Responded'+(otpTs?` — ${fmtDateTime(otpTs)}`:'') : t.evidence.phone==='not-required' ? 'Not requested' : 'Not yet'}</span></div>
      <div class="kv-row"><span class="k">Merchant recognized</span><span class="v">${t.evidence.merchantAck==='verified'?'✓ Yes':'Pending'}</span></div>
      <div class="kv-row"><span class="k">Amount acknowledged</span><span class="v">${t.evidence.amountAck==='verified'?`✓ ${fmtCcy(t.amount,t.currency)}`:'Pending'}</span></div>
      <div class="kv-row"><span class="k">Authorization timestamp</span><span class="v">${t.evidence.auth==='verified' ? fmtDateTime(authTs||new Date().toISOString()) : 'Pending'}</span></div>
      <div class="kv-row"><span class="k">Cardholder / lead guest</span><span class="v">${guestMatch(t).label}</span></div>

    <div class="hint" style="margin-top:10px">The phone signal corroborates that the acknowledgment reached the number on file — it is not identity or card-ownership verification, and it never gates whether this transaction counts as authenticated.</div>

  </div>

  <div class="card card-pad">
    <div class="rs-head"><span class="rs-num">3</span><h3>Commercial Record</h3>${provenanceTag(srcFor('receipt')||'Merchant-reported')}</div>

  </div>

  <div class="card card-pad">

      <div class="kv-list">

        <div class="kv-row"><span class="k">Recipient acknowledgment ${provenanceTag('Customer-confirmed')}</span><span class="v">${t.evidence.deliveryConfirmation==='verified'?'✓ Confirmed':t.evidence.deliveryConfirmation==='missing'?'✕ Missing':'Pending'}</span></div>
      </div>
      <div class="hint" style="margin-top:10px">Carrier tracking shows the parcel was scanned as delivered — that is not the same as the recipient confirming it reached them. The two are kept as separate records; capturing one never overwrites the other.</div>

      <div class="kv-list">

  </div>

  <div class="card card-pad">
    <div class="rs-head"><span class="rs-num">6</span><h3>Audit Trail</h3></div>

}

/* ============================================================ ROUTER ============================================================ */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  return { route: parts[0] || 'dashboard', id: parts[1] || null, tab: parts[2] || null };
}
function navigate(hash){ location.hash = hash; }

const NAV_ITEMS = [
  { route:'dashboard', label:'Overview', icon:'dashboard' },
  { route:'transactions', label:'Transactions', icon:'list' },
  { route:'vault', label:'Evidence vault', icon:'vault' },
  { route:'disputes', label:'Disputes', icon:'gavel' },
];

function render(){
  const { route, id, tab } = parseHash();
  const root = document.getElementById('root');
  if (route === 'verify'){
    root.innerHTML = renderVerifyShell(id);
    bindVerifyEvents(id);
    window.scrollTo(0,0);
    return;
  }
  root.innerHTML = renderMerchantShell(route, id, tab);

  bindRouteEvents(route, id, tab);
  window.scrollTo(0,0);
}

function renderView(route, id, tab){
  if (route==='dashboard') return viewDashboard();
  if (route==='transactions') return viewTransactions();
  if (route==='protect') return viewProtect();
  if (route==='risk') return viewRisk(id);
  if (route==='vault') return viewVault();
  if (route==='disputes') return viewDisputes();
  if (route==='txn') return viewTxnDetail(id, tab);
  return `<div class="empty-note">Not found.</div>`;
}

function bindProtectForm(){
  const form = document.getElementById('protectForm');
  if (!form) return;
  const seg = document.getElementById('typeSeg');
  seg.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    seg.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    form.querySelector('input[name=type]').value = b.dataset.val;
  });
  const intlToggle = document.getElementById('intlToggle');
  const originField = document.getElementById('cardOriginField');
  intlToggle.addEventListener('change', ()=>{ originField.style.display = intlToggle.checked ? '' : 'none'; });

  const providerSel = document.getElementById('providerSel');
  const refInput = document.getElementById('refInput');
  const REF_PREFIX = { 'Moniepoint POS':'MNP-POS-', 'OPay':'OPAY-', 'PalmPay':'PALMPAY-' };
  providerSel.addEventListener('change', ()=>{ refInput.value = REF_PREFIX[providerSel.value] + Math.floor(1000000000+Math.random()*8999999999); });

  const amountInput = form.querySelector('input[name=amount]');
  const currencySel = document.getElementById('currencySel');
  function updateFx(){
    const c = currencySel.value; const amt = parseFloat(amountInput.value)||0;
    document.getElementById('fxHint').textContent = c==='NGN' ? '' : `≈ ${fmtNGN(toNGN(amt,c))} at indicative FX rate`;
  }
  amountInput.addEventListener('input', updateFx); currencySel.addEventListener('change', updateFx);

  const uploadBox = document.getElementById('uploadBox');
  const fileInput = document.getElementById('receiptFile');
  uploadBox.addEventListener('click', ()=>fileInput.click());
  fileInput.addEventListener('change', ()=>{
    if (fileInput.files[0]){
      uploadBox.classList.add('filled');
      uploadBox.querySelector('.u-title').textContent = '✓ ' + fileInput.files[0].name;
      uploadBox.querySelector('.u-sub').textContent = 'Attached — click to replace';
    }
  });

  form.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(form);
    const currency = fd.get('currency');
    const isIntl = !!fd.get('isIntl');
    const newId = "TXN-" + (4000 + ADDED.length + Math.floor(Math.random()*90));
    const txn = {
      id:newId, customer: fd.get('customer'), phone: fd.get('phone'), email: fd.get('email')||'',
      amount: parseFloat(fd.get('amount'))||0, currency, ref: fd.get('ref'), provider: fd.get('provider'), last4: fd.get('last4')||null,
      desc: fd.get('desc'), type: fd.get('type'), isIntl, cardOrigin: isIntl ? fd.get('cardOrigin') : 'Nigeria',
      network: fd.get('network'), isNewCustomer: !!fd.get('isNewCustomer'), date: new Date().toISOString(),
      merchant:null, dispute:null,
      evidence:{ phone:'pending', auth:'pending', amountAck:'pending', merchantAck:'pending', receipt: fileInput.files[0] ? 'verified':'pending', fulfillment:'pending', shippingTracking:'pending', deliveryConfirmation:'pending', completion:'pending' },
      fulfillment:null, docs:[], receiptFileName: fileInput.files[0] ? fileInput.files[0].name : null
    };
    ADDED.unshift(txn); saveAdded(ADDED);
    ACTIVITY[newId] = [ev('created',"Transaction created"+(fileInput.files[0]?" and receipt attached":""),'You',new Date().toISOString())];
    navigate('#/risk/'+newId);
  });
}

/* ============================================================ VIEW: RISK & EVIDENCE ============================================================ */
function viewRisk(id){
  const t = getTxn(id);
  if (!t) return `<div class="empty-note">Transaction not found.</div>`;
  const risk = computeRisk(t);
  const e = evidenceCompleteness(t);
  const beforeItems = e.slots.filter(s=>s.phase==='before');
  const afterItems = e.slots.filter(s=>s.phase==='after');
  const optionalItems = e.slots.filter(s=>s.phase==='optional');
  const rbCls = risk.tier==='High'?'rb-high':risk.tier==='Medium'?'rb-medium':'rb-low';
  return `
  <div style="max-width:820px">
    <div class="risk-banner ${rbCls}">
      <div class="r-icon">${icon(risk.tier==='High'?'alert':risk.tier==='Medium'?'clock':'checkCircle')}</div>
      <div><div class="r-tier">${risk.tier.toUpperCase()} RISK</div><div class="r-desc">Prototype risk score: <b class="tnum">${risk.score}/100</b> · ${t.customer} · ${fmtCcy(t.amount,t.currency)} · ${t.id}</div></div>
    </div>
    <div class="hint" style="margin:-10px 0 20px;font-size:12px">Prototype risk assessment — not a fraud probability. Rule-based criteria, not AI or machine learning.</div>

    <div class="section">
      <div class="section-head"><h2>Why this rating</h2></div>
      <div class="card card-pad">
        <ul class="factor-list">
          ${risk.factors.map(f=>`<li>${icon('info')}<span><b style="font-weight:600">${f.text}</b><br><span style="color:var(--ink-soft)">${f.note}</span></span></li>`).join('')}
        </ul>
      </div>
    </div>

    <div class="card card-pad" style="display:flex;align-items:center;gap:14px;margin-bottom:28px;background:var(--gold-tint);border-color:var(--gold-tint)">
      ${icon('shield')}<div><div style="font-weight:700;font-size:14px">Recommended verification level: ${risk.verificationLevel}</div><div style="font-size:12px;color:var(--ink-soft);margin-top:2px">Based on the risk factors above.</div></div>
    </div>

    <div class="section">
      <div class="section-head"><h2>Evidence to capture — before service</h2></div>
      <div class="evidence-list">${beforeItems.map(i=>evItem(i, t.evidence[i.key])).join('')}</div>
    </div>
    <div class="section">
      <div class="section-head"><h2>Evidence to capture — after service</h2></div>
      <div class="evidence-list">${afterItems.map(i=>evItem(i, t.evidence[i.key])).join('')}${optionalItems.map(i=>evItem(i, t.evidence[i.key])).join('')}</div>
    </div>

    <div class="card card-pad" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--surface-2);border-style:dashed">
      <div style="display:flex;gap:12px;align-items:center;max-width:480px">
        ${icon('link')}<div style="font-size:12.5px;color:var(--ink-soft)">Send the customer a no-login link to verify their phone and confirm they authorized this charge — separate from confirming they received it.</div>
      </div>
      <div style="display:flex;gap:10px">
        <a href="#/txn/${t.id}" class="btn btn-secondary">View transaction</a>
        <button type="button" class="btn btn-primary" data-action="send-link" data-id="${t.id}">${icon('qr')}<span>Send Verification</span></button>
      </div>
    </div>
  </div>`;
}

/* ============================================================ VIEW: EVIDENCE VAULT ============================================================ */
function bucketOf(e){ return e.criticalGap ? 'attention' : e.label==='Strong' ? 'strong' : e.label==='Building' ? 'building' : 'attention'; }
function viewVault(){
  const txns = allTxns();
  const filter = window.__vaultFilter || 'all';
  const withMeta = txns.map(t=>({t, e:evidenceCompleteness(t)}));
  const counts = { all:withMeta.length, strong:0, building:0, attention:0 };
  withMeta.forEach(x=> counts[bucketOf(x.e)]++);
  const filtered = withMeta.filter(x=> filter==='all' ? true : bucketOf(x.e)===filter);
  const securedValue = withMeta.filter(x=>x.e.pct>=90 && !x.e.criticalGap).reduce((s,x)=>s+toNGN(x.t.amount,x.t.currency),0);

  return `
  <div class="trust-stat" style="margin-bottom:18px;max-width:680px">${icon('shield')}<span><b>${fmtNGN(securedValue)}</b> in transaction value has strong evidence on file. <b>Evidence Secured</b> means the recommended documentation is captured — it does not guarantee the outcome of a dispute.</span></div>

  <div class="filter-tabs">
    <button data-filter="all" class="${filter==='all'?'active':''}">All (${counts.all})</button>
    <button data-filter="strong" class="${filter==='strong'?'active':''}">Complete (${counts.strong})</button>
    <button data-filter="building" class="${filter==='building'?'active':''}">Partial (${counts.building})</button>
    <button data-filter="attention" class="${filter==='attention'?'active':''}">Gap (${counts.attention})</button>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px">
    ${filtered.length===0 ? `<div class="empty-note">No transactions in this category.</div>` : filtered.map(({t,e})=>`
      <div class="vault-row" data-nav="#/txn/${t.id}/evidence">
        ${progressRing(e.pct,48)}
        <div class="v-mid"><b>${t.customer}</b>
          <div class="v-meta"><span class="mono">${t.id}</span><span>${t.desc.slice(0,46)}${t.desc.length>46?'…':''}</span>${t.isIntl?`<span>${ccyFlag(t.cardOrigin)} International</span>`:''}${e.criticalGap?`<span class="pill pill-high" style="padding:2px 8px">${icon('alert')}Evidence gap</span>`:''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:14px">
          ${t.dispute?`<span class="pill pill-dispute">${icon('gavel')}Disputed</span>`:''}
          <span class="pill ${e.criticalGap?'pill-high':e.label==='Strong'?'pill-brand':e.label==='Building'?'pill-medium':'pill-high'}">${evLabel(e)} · ${e.pct}%</span>
          <div class="v-amt tnum">${fmtCcy(t.amount,t.currency)}</div>
        </div>
      </div>`).join('')}
  </div>`;
}

  if (window.__disputeOpen){
    return viewDisputeDetail(window.__disputeOpen);

function drawMockQr(canvas, seedStr){
  const ctx = canvas.getContext('2d');
  const n = 21; const cell = canvas.width/n;
  ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--surface') || '#fff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  let seed = 0; for (let i=0;i<seedStr.length;i++) seed = (seed*31 + seedStr.charCodeAt(i)) >>> 0;
  function rnd(){ seed = (seed*1103515245+12345)>>>0; return (seed>>>8)/16777216; }
  const dark = getComputedStyle(document.body).getPropertyValue('--ink') || '#111';
  ctx.fillStyle = dark.trim();
  for (let y=0;y<n;y++) for (let x=0;x<n;x++){
    const inFinder = (x<7&&y<7)||(x>n-8&&y<7)||(x<7&&y>n-8);
    if (inFinder) continue;
    if (rnd() > 0.58) ctx.fillRect(x*cell, y*cell, cell*0.92, cell*0.92);
  }
  function finder(px,py){
    ctx.fillStyle = dark.trim();
    ctx.fillRect(px*cell,py*cell,7*cell,7*cell);
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--surface') || '#fff';
    ctx.fillRect((px+1)*cell,(py+1)*cell,5*cell,5*cell);
    ctx.fillStyle = dark.trim();
    ctx.fillRect((px+2)*cell,(py+2)*cell,3*cell,3*cell);
  }
  finder(0,0); finder(n-7,0); finder(0,n-7);
}

            • Check-in: <b>${checkinVal}</b>${src('checkin')}<br>

/* ============================================================ EVENT BINDING ============================================================ */
function bindGlobalNav(){
  const hb = document.getElementById('hamburgerBtn'); const sb = document.getElementById('sidebar'); const scrim = document.getElementById('scrim');
  if (hb) hb.addEventListener('click', ()=>{ sb.classList.add('open'); scrim.classList.add('show'); });
  if (scrim) scrim.addEventListener('click', ()=>{ sb.classList.remove('open'); scrim.classList.remove('show'); });
}
function globalClickHandler(e){
  const closeBtn = e.target.closest('[data-close]');
  if (closeBtn){ closeModal(); return; }

  const navEl = e.target.closest('[data-nav]');
  if (navEl && !e.target.closest('a')){ navigate(navEl.dataset.nav); return; }

  const tabBtn = e.target.closest('.tabbar button[data-tab]');
  if (tabBtn){ const {route,id} = parseHash(); navigate(`#/${route}/${id}/${tabBtn.dataset.tab}`); return; }

  const filterBtn = e.target.closest('.filter-tabs button[data-filter]');
  if (filterBtn){ window.__vaultFilter = filterBtn.dataset.filter; render(); return; }

  const actionEl = e.target.closest('[data-action]');
  if (actionEl){
    const action = actionEl.dataset.action; const id = actionEl.dataset.id;
    if (action==='send-link'){ pushActivity(id,'verify_sent','Verification link sent to customer','You'); saveAdded(ADDED); window.__sendTab='whatsapp'; openSendLinkModal(id); return; }
    if (action==='send-tab'){ window.__sendTab = actionEl.dataset.tab; openSendLinkModal(id); return; }
    if (action==='open-verify-preview'){ closeModal(); navigate('#/verify/'+id); return; }
    if (action==='copy-link'){ const inp = document.getElementById('linkInput'); inp.select(); navigator.clipboard && navigator.clipboard.writeText(inp.value).catch(()=>{}); showToast('Link copied'); return; }
    if (action==='open-dispute'){ window.__disputeOpen = id; render(); return; }
    if (action==='back-disputes'){ window.__disputeOpen = null; render(); return; }
    if (action==='generate-package'){ pushActivity(id,'package','Evidence package generated for representment','You'); saveAdded(ADDED); openPackageModal(id); return; }
    if (action==='copy-summary'){ const t=getTxn(id); navigator.clipboard && navigator.clipboard.writeText(`Evidence package for ${id} — ${t.customer} — ${fmtCcy(t.amount,t.currency)} — dispute: ${t.dispute?t.dispute.reason:''}`).catch(()=>{}); showToast('Summary copied to clipboard'); return; }
    if (action==='download-pdf'){ showToast('Demo export — PDF download requires a connected payment processor.'); return; }
    if (action==='reset-demo'){ if(confirm('Reset all demo data added this session?')){ ADDED=[]; saveAdded(ADDED); window.__disputeOpen=null; window.__vaultFilter='all'; window.__txnSearch=''; navigate('#/dashboard'); render(); } return; }
    if (action==='back'){ history.back(); return; }
    if (action==='verify-review-next'){ vState(id).step = 2; render(); return; }
    if (action==='verify-otp'){ vState(id).step = 3; render(); return; }
    if (action==='verify-authorize'){
      const s = vState(id);
      s.step = 4; s.authorizedAt = new Date().toISOString();
      const t = getTxn(id);
      if (t){
        t.evidence.phone='verified'; t.evidence.auth='verified'; t.evidence.amountAck='verified'; t.evidence.merchantAck='verified';
        pushActivity(id,'otp','Customer phone verified','System');
        pushActivity(id,'auth','Customer authorization recorded','System');
        if (t.evidence.receipt !== 'verified'){ t.evidence.receipt='verified'; t.receiptFileName = t.receiptFileName || `${id.toLowerCase()}-itemized-receipt.pdf`; pushActivity(id,'receipt','Receipt attached','System'); }
        saveAdded(ADDED);
      }
      render(); return;
    }
    if (action==='upload-receipt'){
      const t = getTxn(id);
      if (t){ t.evidence.receipt='verified'; t.receiptFileName = t.receiptFileName || `${id.toLowerCase()}-itemized-receipt.pdf`; pushActivity(id,'receipt',`Itemized receipt uploaded (${t.receiptFileName})`,'You'); saveAdded(ADDED); showToast('Itemized receipt attached'); }
      render(); return;
    }
    if (action==='verify-split-payer'){
      const t = getTxn(id);
      const phone = actionEl.dataset.phone;
      const payer = t && (t.splitPayments||[]).find(p=>p.phone===phone);
      if (payer && !payer.authorized){
        payer.authorized = true;
        pushActivity(id,'auth',`Split-payment authorization confirmed — ${payer.name} (${maskPhone(payer.phone)})`,'System');
        saveAdded(ADDED);
        showToast(`Verification sent and confirmed for ${payer.name}`);
      }
      render(); return;
    }
    if (action==='open-fulfillment'){ window.__fulfillTab='whatsapp'; window.__fulfillFlagged=false; openFulfillmentModal(id); return; }
    if (action==='fulfill-tab'){ window.__fulfillTab = actionEl.dataset.tab; openFulfillmentModal(id); return; }
    if (action==='fulfill-flag-different'){ window.__fulfillFlagged = true; window.__fulfillTab = 'manual'; openFulfillmentModal(id); return; }
    if (action==='submit-fulfillment'){
      const t = getTxn(id);
      const wasFlagged = !!window.__fulfillFlagged;
      if (t){
        const table = (document.getElementById('fulfillTable')||{}).value || '';
        const checkin = (document.getElementById('fulfillCheckin')||{}).value || '';
        const staff = (document.getElementById('fulfillStaff')||{}).value || 'Front-of-house staff';
        const completion = (document.getElementById('fulfillCompletion')||{}).value || '';
        const tag = wasFlagged ? ' (corrected by staff before confirming)' : '';
        if (t.evidence.receipt !== 'verified'){ t.evidence.receipt='verified'; t.receiptFileName = t.receiptFileName || `${id.toLowerCase()}-itemized-receipt.pdf`; }
        t.evidence.fulfillment = 'verified';
        t.fulfillment = { table, checkin, staff, completion, corrected: wasFlagged };
        t.docs = (t.docs||[]).concat(t.type==='hospitality' ? 'Reservation Confirmation.pdf' : 'Service Fulfillment Record.pdf', 'Customer Authorization Record.pdf');
        pushActivity(id,'checkin', `Customer checked in${table?` — ${table}`:''}${checkin?`, ${checkin}`:''}${tag}`, 'Bizzle');
        pushActivity(id,'fulfilled', `Service marked fulfilled${completion?` — ${completion}`:''}${tag}`, staff);
        pushActivity(id,'finalized','Evidence record finalized','System');
        saveAdded(ADDED); showToast(wasFlagged ? 'Correction saved — evidence finalized' : 'Fulfillment logged — evidence finalized');
        window.__fulfillFlagged = false;
      }
      closeModal(); render(); return;
    }
    if (action==='submit-delivery-evidence'){
      const t = getTxn(id);
      if (t){
        t.evidence.deliveryConfirmation='verified';
        t.docs = (t.docs||[]).concat('Recipient-Acknowledgment.pdf');
        pushActivity(id,'delivery','Recipient acknowledgment captured — carrier-reported delivery record left unchanged','You');
        saveAdded(ADDED); showToast('Recipient acknowledgment captured');
      }
      closeModal(); render(); return;
    }
    if (action==='open-file-dispute'){ openFileDisputeModal(id); return; }
    if (action==='confirm-file-dispute'){
      const sel = document.querySelector('input[name=disputeReason]:checked');
      const reason = sel ? sel.value : 'Transaction Not Recognized';
      const t = getTxn(id);
      if (t){ t.dispute = {reason, status:'open', filedOn:new Date().toISOString()}; pushActivity(id,'dispute',`Dispute filed — “${reason}”`,'System'); saveAdded(ADDED); }
      closeModal(); showToast('Dispute filed (simulated)'); navigate('#/txn/'+id); render(); return;
    }
  }
}

function globalChangeHandler(e){
  const sel = e.target.closest('[data-change="set-dispute-reason"]');
  if (sel){
    const id = sel.dataset.id; const t = getTxn(id);
    if (t && t.dispute && t.dispute.reason !== sel.value){
      t.dispute.reason = sel.value;
      pushActivity(id,'dispute',`Dispute reason updated — “${sel.value}”`,'You');
      saveAdded(ADDED); render();
    }
    return;
  }
}

function bindRouteEvents(route,id,tab){
  if (route==='protect') bindProtectForm();
  if (route==='transactions'){
    const inp = document.getElementById('txnSearch');
    if (inp) inp.addEventListener('input', ()=>{
      window.__txnSearch = inp.value; render();
      requestAnimationFrame(()=>{ const ni=document.getElementById('txnSearch'); if(ni){ ni.focus(); ni.setSelectionRange(ni.value.length,ni.value.length); } });
    });
  }
}

/* ============================================================ INIT ============================================================ */
window.addEventListener('hashchange', render);
document.body.addEventListener('click', globalClickHandler);
document.body.addEventListener('change', globalChangeHandler);
if (!location.hash) location.hash = '#/dashboard';
render();
</script>
